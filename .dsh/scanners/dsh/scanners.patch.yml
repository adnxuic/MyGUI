# Repo-local Cordis patch overlay that mounts the persistent MyGUI scanner
# plugins into any DSH profile.
#
# Usage (from the repository root):
#   dsh --profile <name> \
#       --patch .dsh/scanners/dsh/scanners.patch.yml \
#       [--patch .dsh/scanners/dsh/e2e-exit.patch.yml]
#
# Resolution rules of the current DSH (0.1.0-rc.7 / cordis-plugin-loader
# 1.0.2): entry `name` specifiers are imported from the loader's baseUrl —
# the profile directory — so the profile's node_modules must expose this
# package under the bare name `mygui-scanners`. Point it at this checkout:
#
#   mkdir -p "$DSH_HOME/profiles/<name>/node_modules"
#   ln -s /abs/path/to/MyGUI/.dsh/scanners \
#         "$DSH_HOME/profiles/<name>/node_modules/mygui-scanners"
#
# (dsh/verify-e2e.sh automates this against an isolated DSH_HOME.)
#
# These plugins are Harness-internal: they register no model-facing tools.
- insert:
    - id: mygui-scanner-registry
      name: mygui-scanners/dist/registry/plugin.js

    - id: mygui-scanner-architecture
      name: mygui-scanners/dist/scanners/architecture/plugin.js

    - id: mygui-scanner-qt-lifecycle
      name: mygui-scanners/dist/scanners/qt-lifecycle/plugin.js
