<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <clipPath id="bar-clip">
      <rect x="80" y="36" width="44" height="152" rx="4" ry="4"/>
    </clipPath>
  </defs>

  <!-- Shift the complete icon to the exact visual center of the 256×256 canvas -->
  <g transform="translate(9 16)">
    <!-- Fully filled color cells -->
    <g clip-path="url(#bar-clip)">
      <rect x="80" y="36" width="44" height="30.4" fill="#FFE100"/>
      <rect x="80" y="66.4" width="44" height="30.4" fill="#A8DA1A"/>
      <rect x="80" y="96.8" width="44" height="30.4" fill="#22C7A9"/>
      <rect x="80" y="127.2" width="44" height="30.4" fill="#1F7AE8"/>
      <rect x="80" y="157.6" width="44" height="30.4" fill="#8B0AAE"/>
    </g>

    <!-- Outer frame -->
    <rect x="76" y="32" width="52" height="160" rx="8" ry="8"
          fill="none" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>

    <!-- Segment dividers -->
    <g stroke="#000000" stroke-width="6" stroke-linecap="square">
      <line x1="80" y1="66.4" x2="124" y2="66.4"/>
      <line x1="80" y1="96.8" x2="124" y2="96.8"/>
      <line x1="80" y1="127.2" x2="124" y2="127.2"/>
      <line x1="80" y1="157.6" x2="124" y2="157.6"/>
    </g>

    <!-- Tick marks -->
    <g stroke="#000000" stroke-width="7" stroke-linecap="round">
      <line x1="144" y1="51.2" x2="162" y2="51.2"/>
      <line x1="144" y1="81.6" x2="162" y2="81.6"/>
      <line x1="144" y1="112.0" x2="162" y2="112.0"/>
      <line x1="144" y1="142.4" x2="162" y2="142.4"/>
      <line x1="144" y1="172.8" x2="162" y2="172.8"/>
    </g>
  </g>
</svg>
