name: Windows CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: qtagg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q mygui tests main.py
      - name: Ruff
        run: python -m ruff check mygui tests main.py
      - name: Unit tests with branch coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Coverage gate
        run: python -m coverage report
      - name: Critical component-contract coverage gate
        run: >-
          python -m coverage report --fail-under=80
          mygui/project_io.py
          mygui/widgets/figure_canvas/component_materializers.py
          mygui/widgets/figure_canvas/project_metadata.py
          mygui/widgets/figure_canvas/py_figure_canves.py
