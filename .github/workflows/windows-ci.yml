name: Repository CI

on:
  push:
  pull_request:

jobs:
  application:
    name: Windows application
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: qtagg
      MYGUI_TEST_SHARDS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run shared application profile
        run: python .agents/checks/verify_full.py --profile application
      - name: Upload application evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-evidence
          if-no-files-found: error
          path: |
            build/agent-results/*.json
            build/agent-results/application/**
            .coverage

  agent-engineering:
    name: Ubuntu Agent Engineering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Agent Core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run shared Agent Engineering profile
        run: python .agents/checks/verify_full.py --profile agent-engineering
      - name: Upload Agent Engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-engineering-evidence
          if-no-files-found: error
          path: build/agent-results/*.json
