site_name: MyGUI
site_description: MyGUI usage and component documentation
site_url: https://adnxuic.github.io/MyGUI/
repo_url: https://github.com/adnxuic/MyGUI
repo_name: adnxuic/MyGUI
edit_uri: edit/master/docs/

docs_dir: docs
exclude_docs: |
  _snippets/**
  axes-component-parameters.md
  chart-component-parameters.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - navigation.top
    - navigation.indexes

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true

plugins:
  - search
  - redirects:
      redirect_maps:
        chart-component-parameters.md: editing-components/charts/line.md
        axes-component-parameters.md: editing-components/fixed-semantics/axes.md

