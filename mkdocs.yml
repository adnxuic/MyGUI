site_name: MyGUI
site_description: MyGUI usage and component documentation
site_url: https://adnxuic.github.io/MyGUI/
repo_url: https://github.com/adnxuic/MyGUI
repo_name: adnxuic/MyGUI
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - navigation.top

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - GUI Workbench: workbench.md
      - Project Undo and Redo: undo-redo.md
      - Keyboard and Mouse Reference: keyboard-and-mouse-reference.md
      - Bottom Bar: bottom-bar.md
  - Working with Data:
      - Table Data: table-data.md
      - Data Preprocessing: data-preprocessing.md
      - Text Data Import: text-data-import.md
      - Excel Import: excel-import.md
  - Creating Charts:
      - Axes Layout Templates: axes-layouts.md
      - Multi-Series Chart Creation: multi-series-charts.md
      - Function Curve: function-curve.md
      - Interpolation: interpolation.md
      - Fitting: fitting.md
      - In-Axes Elements: in-axes.md
      - Text Element: text-element.md
      - Reference Guides: reference-guides-component.md
      - Reference Marks Component: reference-marks-component.md
      - Colorbar Component: colorbar-component.md
      - Color Picker: color-picker.md
  - Editing Components:
      - Components Tree: components-tree.md
      - Chart Component Parameters: chart-component-parameters.md
      - Axes and Figure Component Parameters: axes-component-parameters.md
  - Projects and Appearance:
      - Project Files: project-files.md
      - Style Creation Defaults: style-creation-defaults.md
  - Integrations and Configuration:
      - TeX Rendering Integration: tex-integration.md
      - Resource and Process Limits: resource-limits.md
  - Developer Reference:
      - Component Controllers: component-controllers.md
      - Component Inspector Architecture: component-inspector.md
      - Atomic Component Deletion: component-deletion.md
      - Component Extension Template: component-extension-template.md
      - Component Properties (schema v15): component-properties-v15.md
      - Legacy schema v14 migration properties: component-properties-v14.md
      - Legacy schema v13 migration properties: component-properties-v13.md
      - Legacy schema v12 migration properties: component-properties-v12.md
      - Legacy schema v10 migration properties: component-properties-v10.md
  - Maintenance & QA:
      - Manual Smoke Test: smoke-test.md
      - Documentation Site: documentation-site.md
