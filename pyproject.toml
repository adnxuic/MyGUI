[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "mygui/database/matlab_func/curve_fitting/__init__.py",
    "mygui/database/matlab_func/get_func/__init__.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
# Matplotlib backend, TeX runtime, and font diagnostics must be initialized
# before importing the application widgets. Keep this startup ordering intact.
"main.py" = ["E402"]
# The Error Bar creation dialog reuses this module's frozen-plan helpers; the
# late import keeps the package cycle one-directional at load time.
"mygui/widgets/title_bar/titlebar_dialog/py_chart_dialog.py" = ["E402"]
