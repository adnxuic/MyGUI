[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "mygui/database/matlab_func/curve_fitting/__init__.py",
    "mygui/database/matlab_func/get_func/__init__.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Matplotlib backend, TeX runtime, and font diagnostics must be initialized
# before importing the application widgets. Keep this startup ordering intact.
"main.py" = ["E402"]
